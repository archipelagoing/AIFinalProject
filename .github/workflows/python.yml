name: Python Phase 0 contracts and fixtures

on:
  push:
    branches: [main]
    paths: ['app.py', 'compass/**', 'fixtures/**', 'scripts/audit_fixtures.py', 'tests/python/**', 'requirements.txt', 'pyproject.toml', '.streamlit/**', '.github/workflows/python.yml']
  pull_request:
    paths: ['app.py', 'compass/**', 'fixtures/**', 'scripts/audit_fixtures.py', 'tests/python/**', 'requirements.txt', 'pyproject.toml', '.streamlit/**', '.github/workflows/python.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase0:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python scripts/audit_fixtures.py
      - run: python -m pytest -q
