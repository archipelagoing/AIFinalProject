name: Test and deploy Compass to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['docs/**', 'tests/**', 'package.json', 'CompassProto1.0/*.csv', 'CompassProto1.0/*.json', '.github/workflows/pages.yml']
  pull_request:
    paths: ['docs/**', 'tests/**', 'package.json', 'CompassProto1.0/*.csv', 'CompassProto1.0/*.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compass-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test imports, accounting, scenarios, and storage
        run: npm test
      - name: Check application syntax
        run: |
          node --check docs/app.js
          node --check docs/engine.js
          node --check docs/storage.js

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy prototype
        id: deployment
        uses: actions/deploy-pages@v4
