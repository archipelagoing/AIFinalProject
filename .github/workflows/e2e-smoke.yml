name: End-to-end smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run Python suite
        run: python -m pytest -q
      - name: Run isolated browser smoke
        run: python scripts/release_smoke.py --output artifacts/release
      - name: Upload screenshot and JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compass-e2e-smoke-${{ github.run_id }}
          path: artifacts/release/
          if-no-files-found: warn
          retention-days: 14
